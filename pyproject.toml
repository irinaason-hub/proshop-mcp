[project]
name = "proshop-mcp"
version = "0.1.0"
description = "MCP server over an Order entity (proshop_mern backend/models/orderModel.js)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
